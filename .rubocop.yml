plugins:
  - rubocop-rspec
  - rubocop-rake
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  # Both gemspecs require Ruby >= 3.2.0; RuboCop cannot infer it from a gemspec in a subdirectory.
  TargetRubyVersion: 3.2

Style/OneClassPerFile:
  Exclude:
    - '**/spec/support/test_classes/**/*'

# RuboCop's default excludes match spec/ at the repository root only.
Style/Documentation:
  Exclude:
    - '**/spec/**/*'
    - '**/test/**/*'

Layout/LeadingCommentSpace:
  Enabled: false

# ========= RSpec ===========
RSpec/SpecFilePathFormat:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 5

RSpec/NestedGroups:
  Max: 5

RSpec/ExampleLength:
  Max: 15

# ========= Metrics =========
Metrics/ClassLength:
  Max: 150

Metrics/MethodLength:
  Max: 25
