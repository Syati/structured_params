prepare-commit-msg:
  commands:
    rbs-inline:
      run: (cd structured_params && bundle exec rbs-inline --output=sig lib/**/*.rb) && (cd structured_params-openapi && bundle exec rbs-inline --output=sig lib/**/*.rb) && git add structured_params/sig/ structured_params-openapi/sig/

pre-commit:
  commands:
    rubocop:
      run: ./bin/rubocop
    rspec:
      run: cd structured_params && bundle exec rspec
    rspec-open-api:
      run: cd structured_params-openapi && bundle exec rspec
    steep:
      run: bundle exec steep check
